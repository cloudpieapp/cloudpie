name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Build React app
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync ios

    - name: Build iOS app
      run: |
        cd ios/App
        xcodebuild -scheme App \
          -configuration Release \
          -derivedDataPath build \
          -archivePath build/App.xcarchive \
          -skipPackagePluginValidation \
          archive 2>&1 || true
        
        # If archive succeeded, export IPA
        if [ -d "build/App.xcarchive" ]; then
          echo "Archive created successfully"
        else
          echo "Archive creation failed, attempting alternative build"
          xcodebuild -scheme App \
            -configuration Release \
            -derivedDataPath build \
            build 2>&1 || true
        fi

    - name: Export IPA
      run: |
        cd ios/App
        if [ -d "build/App.xcarchive" ]; then
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa 2>&1 || true
        fi

    - name: Check IPA
      run: |
        cd ios/App
        if [ -f "build/ipa/App.ipa" ]; then
          ls -lh build/ipa/App.ipa
        elif [ -d "build/Release-iphoneos" ]; then
          ls -lh build/Release-iphoneos/
        else
          echo "No IPA or build output found"
          find build -type f -name "*.app" -o -name "*.ipa" 2>/dev/null | head -10
        fi

    - name: Rename IPA
      run: |
        cd ios/App/build/ipa
        ls -la 2>/dev/null || true
        if [ -f "App.ipa" ]; then
          mv App.ipa app-release.ipa
          echo "IPA renamed successfully"
        else
          echo "No IPA found in build/ipa"
        fi

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v1
      if: always()
      with:
        files: ios/App/build/ipa/app-release.ipa
        tag_name: v1.0.0-ios
        body: "BingBloom iOS App Release (experimental build)"
        prerelease: true
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload IPA as artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: iOS-app
        path: ios/App/build/ipa/
        retention-days: 30
